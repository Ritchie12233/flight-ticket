name: Bug 价机票监控

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 每 15 分钟，避开整点高峰（GitHub 整点排队严重）
  push:
    branches: [main]
    paths: ["config.yaml", "monitor/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      test_push:
        description: "只发一条测试推送"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fare-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 运行监控
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            python -m monitor.main --test-push
          else
            python -m monitor.main
          fi

      - name: 保存数据并更新网站
        if: ${{ inputs.test_push != true }}
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kuala_Lumpur date '+%m-%d %H:%M') 更新票价"
          git pull --rebase --autostash || true
          git push
